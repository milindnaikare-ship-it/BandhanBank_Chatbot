<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Before I Sign Off</title>
    <meta
      name="description"
      content="A small farewell note, told in memes, for the people who made this journey memorable."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="hero">
      <h1 class="hero-title">Before I Sign&nbsp;Off</h1>
      <p class="hero-caption">
        Some journeys end, but the people and moments that made them meaningful
        stay with us. Before I move forward, I wanted to leave a small note for
        the people who made this journey memorable.
      </p>
      <a class="scroll-cue" href="#memes" aria-label="Scroll to the memes">
        <span>Scroll</span>
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M12 4v16m0 0-6-6m6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </a>
    </header>

    <main id="memes" class="memes" aria-label="Memes"></main>

    <footer class="signoff">
      <p>Signing off.</p>
    </footer>

    <script src="memes.js"></script>
    <script src="script.js"></script>
  </body>
</html>
